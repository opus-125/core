services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    # Bridge the audit bundle's per-subject key onto the GDPR key store, so that
    # crypto-shredding a citizen via `gdpr:erase` also redacts their sensitive
    # audit values — while the audit hash-chain stays valid. This one alias is the
    # entire integration between the two otherwise-independent bundles.
    Opus125\AuditBundle\Crypto\SubjectKeyProviderInterface: '@Opus125\GdprBundle\Integration\Audit\AuditKeyProviderBridge'
