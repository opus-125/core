name: CI

on:
  push:
    branches: [main]
  pull_request: ~

jobs:
  tests:
    name: Tests & static analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opus125_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Consumed by the audit-bundle test harness (OrmFactory / functional kernel).
      OPUS125_AUDIT_TEST_DSN: "postgresql://postgres:postgres@127.0.0.1:5432/opus125_audit_test"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate monorepo
        run: composer monorepo:validate

      - name: Coding standards
        run: composer cs

      - name: Static analysis
        run: composer phpstan

      - name: Tests
        run: composer test
