name: Sync docs to opus-125.github.io

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sync-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target repo (opus-125/opus-125.github.io)
        uses: actions/checkout@v4
        with:
          repository: opus-125/opus-125.github.io
          ref: main
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/docs/package-lock.json

      - name: Build docs site
        working-directory: source/docs
        run: |
          npm ci
          npm run build

      # Pages serves static files only — it does not transpile TypeScript.
      # Mirror the built `dist/` output, never the raw source (which references
      # /src/main.tsx and would be served as application/octet-stream).
      - name: Mirror built docs into target repo
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            source/docs/dist/ target/
          # Prevent GitHub Pages' Jekyll from ignoring asset paths.
          touch target/.nojekyll

      - name: Commit and push if changed
        working-directory: target
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
            exit 0
          fi

          git add -A
          git commit -m "Sync docs from ${SOURCE_REPO}@${SOURCE_SHA:0:7}

          Source: https://github.com/${SOURCE_REPO}/commit/${SOURCE_SHA}"
          git push origin HEAD:main
